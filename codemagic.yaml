workflows:
  android-debug:
    name: Quizzo Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.27.4
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"
      - name: Flutter pub get
        script: cd "$CM_BUILD_DIR" && flutter pub get
      - name: Build Debug APK
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --debug --build-name=2.0.0 --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients: [your-email@example.com]
        notify: {success: true, failure: true}

  android-release:
    name: Quizzo Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.27.4
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"
      - name: Flutter pub get
        script: cd "$CM_BUILD_DIR" && flutter pub get
      - name: Build Release APK
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --release --build-name=2.0.0 --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients: [your-email@example.com]
        notify: {success: true, failure: true}
