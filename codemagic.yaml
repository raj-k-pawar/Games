# Quizzo - Codemagic CI/CD
# AGP 8.7.3 + Gradle 8.10.2 + Flutter stable
workflows:

  # ── Debug APK (no signing required - works immediately) ───────────────────
  android-debug:
    name: Quizzo Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.27.4

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Build Debug APK
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --debug \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  # ── Release APK (no keystore - debug-signed, installable on any device) ───
  android-release-unsigned:
    name: Quizzo Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.27.4

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Build Release APK
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  # ── Signed Release (add keystore env vars in Codemagic App Settings) ──────
  # Environment variables needed:
  #   CM_KEYSTORE        = base64-encoded .keystore file
  #   CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
  android-release-signed:
    name: Quizzo Android Signed Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.27.4
      android_signing:
        - quizzo_keystore

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Set up key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" << EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Build Signed APK + AAB
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
