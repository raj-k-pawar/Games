# KidzoLand - Codemagic CI/CD
# No keystore required - uses Flutter's automatic debug signing
workflows:

  # ── WORKFLOW 1: Debug APK (works immediately, no signing setup) ────────────
  android-debug:
    name: KidzoLand Android Debug APK
    max_build_duration: 45
    instance_type: mac_mini_m1

    environment:
      flutter: stable

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Build Debug APK
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --debug \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  # ── WORKFLOW 2: Release APK (no keystore - auto debug-signed) ─────────────
  android-release-unsigned:
    name: KidzoLand Android Release APK
    max_build_duration: 45
    instance_type: mac_mini_m1

    environment:
      flutter: stable

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Build Release APK
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  # ── WORKFLOW 3: Signed Release (only if you add keystore env vars) ─────────
  # In Codemagic App Settings → Environment variables, add:
  #   CM_KEYSTORE        = base64 of your .keystore file
  #   CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
  android-release-signed:
    name: KidzoLand Android Signed Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      android_signing:
        - kidzoland_keystore

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Set up key.properties
        script: |
          cat >> "$CM_BUILD_DIR/android/key.properties" << EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Build Signed APK + AAB
        script: |
          cd "$CM_BUILD_DIR"
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
