name: quizzo
description: Quizzo - Learn, Play, Win!

publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Animations
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Storage
  shared_preferences: ^2.2.2

  # UI utilities
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
