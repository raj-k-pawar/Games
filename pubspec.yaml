name: quizzo
description: Quizzo - Learn, Play, Win!

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  shared_preferences: ^2.2.2
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  
flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
